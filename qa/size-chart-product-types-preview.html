<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Type Size Chart Preview</title>
  <style>
    :root{--ink:#203224;--line:#d8ded7;--muted:#68756b}
    *{box-sizing:border-box} body{margin:0;padding:24px;background:#e8ece9;color:#34463a;font:14px/1.55 Arial,sans-serif}
    button{font:inherit}.shell{width:min(900px,100%);margin:auto;overflow:hidden;border:1px solid rgba(32,50,36,.12);border-radius:6px;background:#fff;box-shadow:0 22px 56px rgba(15,24,18,.22)}
    .header{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid rgba(32,50,36,.16)}
    h1{margin:0;color:var(--ink);font-size:20px;letter-spacing:.04em;text-transform:uppercase}.close{width:36px;height:36px;border:0;background:none;color:var(--ink);font-size:28px}
    .types{display:flex;gap:6px;padding:18px 26px 0;overflow:auto;scrollbar-width:none}.types::-webkit-scrollbar{display:none}
    .types button{flex:0 0 auto;padding:9px 14px;border:1px solid #d7dfd6;border-radius:999px;background:#f7faf6;color:#31513f;font-size:12px;font-weight:700;cursor:pointer}.types button.active{border-color:var(--ink);background:var(--ink);color:#fff}
    .content{padding:18px 26px 30px}.units{display:flex;width:max-content;margin:0 auto 18px;overflow:hidden;border:1px solid var(--ink);border-radius:999px}.units[hidden],.chart[hidden]{display:none}.units button{min-width:60px;padding:9px 18px;border:0;background:#fff;color:var(--ink);font-size:11px;font-weight:700}.units button.active{background:var(--ink);color:#fff}
    h2{margin:0 0 8px;color:var(--ink);font-size:18px}.note{margin:0 0 16px;color:var(--muted);font-size:13px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}th,td{padding:11px 16px;white-space:nowrap;text-align:center}th{background:var(--ink);color:#faf6ee;text-transform:uppercase}td{border-bottom:1px solid var(--line)}
    .measure-note{margin:22px 0 0;padding-top:18px;border-top:1px solid var(--line);font-size:13px}.guide{display:grid;grid-template-columns:minmax(240px,.82fr) minmax(0,1.18fr);gap:38px;align-items:center;margin-top:22px}.figure{display:flex;min-width:0;margin:0;align-items:center;justify-content:center;overflow:hidden}.figure img{display:block;width:auto;max-width:100%;height:auto;max-height:330px;object-fit:contain}.instructions{display:grid;gap:11px;min-width:0}.instructions h3{margin:0;color:var(--ink);font-size:17px;text-transform:uppercase}.instructions p{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;margin:0;font-size:13px}.num{display:inline-grid;width:22px;height:22px;place-items:center;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:700}.instructions strong{text-transform:uppercase;color:var(--ink)}
    @media(max-width:767px){body{padding:10px}.header{padding:16px 14px}h1{font-size:17px}.types{padding:14px 14px 0}.content{padding:16px 14px 24px}.guide{grid-template-columns:1fr;gap:20px}.figure img{max-height:280px}table{min-width:520px}th,td{padding:9px 12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="header"><h1 id="page-title">T-Shirt Size Guide</h1><button class="close" aria-label="Close">&times;</button></header>
    <nav class="types" aria-label="Product type">
      <button class="active" data-type="tshirt">T-Shirt</button><button data-type="hoodie">Hoodie</button><button data-type="sweatshirt">Sweatshirt</button><button data-type="longsleeve">Long Sleeve</button><button data-type="shirt">Shirt</button><button data-type="beanie">Beanie Hat</button><button data-type="hat">Hat</button>
    </nav>
    <section class="content">
      <div class="units"><button class="active" data-unit="in">In</button><button data-unit="cm">Cm</button></div>
      <div class="chart"><h2 id="chart-title"></h2><p class="note" id="chart-note"></p><div class="table-wrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div></div>
      <p class="measure-note" id="measure-note"></p>
      <div class="guide"><figure class="figure"><img id="image" alt=""></figure><div class="instructions"><h3>How to measure</h3><div id="instructions"></div></div></div>
    </section>
  </main>
  <script>
    const products={
      tshirt:{title:'T-Shirt Size Guide',chart:'Adult T-Shirt Size Chart',image:'../assets/tshirt-size-guide.webp',headers:['Size','Width','Length','Sleeve Length'],rows:{in:[['S','18','28','15.125'],['M','20','29','16.5'],['L','22','30','18'],['XL','24','31','19.5']],cm:[['S','45.7','71.1','38.4'],['M','50.8','73.7','41.9'],['L','55.9','76.2','45.7'],['XL','61.0','78.7','49.5']]},note:'Width, length, and sleeve values are taken from the garment laid flat.',steps:[['Width','Measure flat across the garment just below the armholes.'],['Length','Measure from the highest shoulder point beside the collar to the bottom hem.'],['Sleeve length','Measure from the center back neckline across the shoulder to the sleeve hem.']]},
      hoodie:{title:'Hoodie Size Guide',chart:'Hoodie Size Chart',image:'../assets/hoodie-size-guide.webp',headers:['Size','Chest','Length','Sleeve'],rows:{in:[['S','20','27','33.5'],['M','22','28','34.5'],['L','24','29','35.5'],['XL','26','30','36.5']],cm:[['S','50.8','68.6','85.1'],['M','55.9','71.1','87.6'],['L','61.0','73.7','90.2'],['XL','66.0','76.2','92.7']]},note:'Chest, length, and sleeve values are garment measurements.',steps:[['Chest','Measure flat across the garment just below the armholes.'],['Length','Measure from the highest shoulder point beside the neckline to the bottom hem.'],['Sleeve','Measure from the center back neckline across the shoulder and down to the cuff.']]},
      sweatshirt:{title:'Sweatshirt Size Guide',chart:'Sweatshirt Size Chart',image:'../assets/sweatshirt-size-guide.webp',headers:['Size','Chest','Length','Sleeve'],rows:{in:[['S','20','27','33.5'],['M','22','28','34.5'],['L','24','29','35.5'],['XL','26','30','36.5']],cm:[['S','50.8','68.6','85.1'],['M','55.9','71.1','87.6'],['L','61.0','73.7','90.2'],['XL','66.0','76.2','92.7']]},note:'Chest, length, and sleeve values are garment measurements.',steps:[['Chest','Measure flat across the garment just below the armholes.'],['Length','Measure from the highest shoulder point beside the neckline to the bottom hem.'],['Sleeve','Measure from the center back neckline across the shoulder and down to the cuff.']]},
      longsleeve:{title:'Long Sleeve Size Guide',chart:'Long Sleeve Size Chart',image:'../assets/long-sleeve-size-guide.webp',headers:['Size','Length','Chest','Shoulder','Sleeve'],rows:{in:[['S','28','18','16','32.5'],['M','29','20','17.25','34'],['L','30','22','18.5','35.5'],['XL','31','24','19.75','37']],cm:[['S','71.1','45.7','40.6','82.6'],['M','73.6','50.8','43.8','86.4'],['L','76.2','55.9','47.0','90.2'],['XL','78.7','60.9','50.2','94.0']]},note:'Use the selected table labels: standard chest is flat width; 3D chest is garment circumference.',steps:[['Length','Highest shoulder point to bottom hem.'],['Chest','Measure flat below the armholes; use circumference only for the 3D chart.'],['Shoulder','Measure from shoulder seam to shoulder seam.'],['Sleeve','Center back neckline across the shoulder and down to the cuff.']]},
      shirt:{title:'Shirt Size Guide',chart:'Classic Fit Aloha Shirt Size Chart',image:'../assets/shirt-size-guide.webp',headers:['Size','Neck','Chest','Waist','Shoulder','Length'],rows:{in:[['S','16.7','46.1','43.3','20.1','29.5'],['M','17.1','48.0','46.5','20.5','30.3'],['L','17.5','50.4','49.6','21.1','31.5']],cm:[['S','42.4','117.1','110.0','51.1','74.9'],['M','43.4','121.9','118.1','52.1','77.0'],['L','44.5','128.0','126.0','53.6','80.0']]},note:'Measurements above are garment measurements, not body dimensions.',steps:[['Neck','Measure around the inside of the collar.'],['Chest','Measure around the garment at underarm level.'],['Waist','Measure around the garment at the natural waist.'],['Shoulder','Measure from shoulder seam to shoulder seam.'],['Length','Highest shoulder point beside the collar to bottom hem.']]},
      beanie:{title:'Beanie Hat Measurement Guide',image:'../assets/beanie-hat-size-guide.webp',note:'Use the measurements shown for the selected variant. Head circumference is the primary fit check.',steps:[['Opening circumference','Measure around the inside edge without stretching it.'],['Overall height','Measure from the crown top to the lower edge.'],['Cuff height','Measure vertically from the cuff fold to its lower edge.']]},
      hat:{title:'Hat Measurement Guide',image:'../assets/hat-size-guide.webp',note:'For adjustable hats, compare the inner-band circumference with a comfortable hat you already own.',steps:[['Inner circumference','Measure around the inside sweatband at your preferred closure setting.'],['Crown height','Measure from the top button to the lower band.'],['Brim length','Measure from the crown seam to the front edge of the brim.']]}
    };
    let type='tshirt',unit='in';
    const $=s=>document.querySelector(s);
    function render(){const p=products[type],hasChart=!!p.rows;$('#page-title').textContent=p.title;$('.units').hidden=!hasChart;$('.chart').hidden=!hasChart;if(hasChart){$('#chart-title').textContent=p.chart;$('#chart-note').innerHTML=`Measurements are in <strong>${unit==='in'?'inches':'centimeters (cm)'}</strong>.`;$('#head').innerHTML=p.headers.map(x=>`<th>${x}${x==='Size'?'':` (${unit})`}</th>`).join('');$('#body').innerHTML=p.rows[unit].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}$('#measure-note').innerHTML=`<strong>Note:</strong> ${p.note}`;$('#image').src=p.image;$('#image').alt=p.title+' illustration';$('#instructions').innerHTML=p.steps.map((s,i)=>`<p><span class="num">${i+1}</span><span><strong>${s[0]}</strong> — ${s[1]}</span></p>`).join('')}
    document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelectorAll('[data-unit]').forEach(b=>b.addEventListener('click',()=>{unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('active',x===b));render()}));render();
  </script>
</body>
</html>

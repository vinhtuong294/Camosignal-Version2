# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "49fc0a152118b88c102f1d1369a2b2e5"
application_url = "https://flex-cart-upsell.vercel.app"
embedded = true
name = "Selleasy version 2"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,write_app_proxy,write_discounts"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://flex-cart-upsell.vercel.app/auth/callback",
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "products/create", "products/update", "products/delete" ]
  uri = "/webhooks/products/sync"

[app_proxy]
url = "/apps/flex-cart-upsell"
prefix = "apps"
subpath = "flex-cart-upsell"

[build]
automatically_update_urls_on_dev = true
